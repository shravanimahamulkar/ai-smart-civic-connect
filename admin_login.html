<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Verification</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body style="margin:0;font-family:Poppins;background:#0f172a;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:14px;">
<div style="background:white;width:100%;max-width:360px;padding:22px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.3);">
<h2 style="margin:0 0 6px;font-size:22px;font-weight:700;">Admin<br>Verification</h2>
<p style="font-size:12px;color:#64748b;margin:0 0 14px;">Indradeep IT - Secure Access</p>

<input id="user" value="shravanimahamulka" style="width:100%;box-sizing:border-box;padding:12px;border:1.5px solid #cbd5e1;border-radius:12px;margin-bottom:10px;background:#eef2ff;font-size:13px;">
<input id="pass" type="password" value="12345678" style="width:100%;box-sizing:border-box;padding:12px;border:1.5px solid #e2e8f0;border-radius:12px;margin-bottom:10px;font-size:13px;">
<input id="code" value="CIVIC" style="width:100%;box-sizing:border-box;padding:12px;border:1.5px solid #e2e8f0;border-radius:12px;margin-bottom:14px;font-size:13px;">

<button onclick="login()" style="width:100%;background:#2563eb;color:white;border:none;padding:12px;border-radius:12px;font-weight:600;font-size:14px;cursor:pointer;">Verify & Login</button>

<p id="msg" style="font-size:12px;color:green;text-align:center;margin-top:10px;display:none;">Verified! Redirecting...</p>
</div>

<div style="position:fixed;bottom:0;left:0;right:0;background:#0f172a;color:#cbd5e1;text-align:center;padding:10px;font-size:11px;line-height:1.6;">
<b style="color:white;">Developed by: Shravani Mahamulkar</b> | Program: Inplant Training 2026<br>College: Arvind Gavali College of Engineering<br><span style="color:#ff8c00;">Indradeep Information Technology Pvt Ltd</span>
</div>

<script>
function login(){
 document.getElementById('msg').style.display='block';
 // Kahi pan takla tari login hoil - demo sathi
 setTimeout(()=>{ window.location.href='admin-dashboard.html?v=2'; }, 800);
}
</script>
</body></html>
