<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Verify</title><style>body{margin:0;background:#0f172a;display:flex;justify-content:center;align-items:center;height:100vh;font-family:system-ui}.box{background:#fff;padding:30px;border-radius:16px;width:350px}input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:10px;box-sizing:border-box}button{width:100%;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer;margin-top:10px}#msg{color:red;font-size:13px;text-align:center;margin-top:10px}</style></head><body><div class="box"><h2>Admin Verification</h2><input id="email" type="email" placeholder="Admin Email"><input id="pass" type="password" placeholder="Password"><input id="code" type="text" placeholder="Secret Code = CIVIC2026"><button onclick="login()">Verify & Login</button><div id="msg"></div></div><script type="module">import { auth, db } from "/static/js/firebase-config.js";import { signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";const SECRET="CIVIC2026";window.login=async()=>{const e=document.getElementById('email').value,p=document.getElementById('pass').value,c=document.getElementById('code').value.trim(),m=document.getElementById('msg');if(c!==SECRET){m.innerText="❌ Wrong Verification Code!";return;}try{const cred=await signInWithEmailAndPassword(auth,e,p);const snap=await getDoc(doc(db,"admins",cred.user.uid));if(!snap.exists()||snap.data().role!=="admin"||snap.data().isVerified!==true){m.innerText="⛔ Not verified admin";await signOut(auth);return;}localStorage.setItem("isAdmin","true");location.href="/admin";}catch(err){m.innerText=err.message;}}</script></body></html>
