<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel</title></head>
<body style="margin:0;font-family:Poppins,sans-serif;background:#f1f5f9;">
<div style="background:#0f172a;color:white;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;"><b style="font-size:13px;">Admin Panel - Verified ✅</b><a href="index.html" style="background:#ef4444;color:white;padding:6px 12px;border-radius:16px;text-decoration:none;font-size:12px;">Secure Logout</a></div>
<div style="max-width:800px;margin:14px auto;padding:0 10px;">
<div style="background:white;padding:16px;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.05);">
<h3 style="margin:0 0 10px;">All Complaints</h3>
<table style="width:100%;border-collapse:collapse;font-size:13px;text-align:left;">
<tr style="background:#f8fafc;"><th style="padding:9px;border-bottom:2px solid #e2e8f0;">Title</th><th style="border-bottom:2px solid #e2e8f0;">User</th><th style="border-bottom:2px solid #e2e8f0;">Status</th><th style="border-bottom:2px solid #e2e8f0;">Action</th></tr>
<tbody id="tbody"><tr><td colspan="4" style="text-align:center;padding:18px;">Loading & Verifying...</td></tr></tbody>
</table>
</div></div>
<footer style="background:#0f172a;color:#cbd5e1;text-align:center;padding:16px;font-size:12px;margin-top:20px;border-top:3px solid #2563eb;line-height:1.8;">
<b style="color:white;">Developed by: Shravani Mahamulkar</b><br>Program: Inplant Training 2026<br>College: Arvind Gavali College of Engineering, Satara<br><span style="color:#ff8c00;font-weight:600;">Indradeep Information Technology Pvt Ltd</span></footer>
<script>
const data=[
{title:"Road Damage near ST Stand",user:"Rahul P.",status:"Pending",color:"#f59e0b"},
{title:"Garbage Issue - Market Area",user:"Shravani M.",status:"In Progress",color:"#2563eb"},
{title:"Water Leakage",user:"Amit J.",status:"Resolved",color:"#16a34a"}
];
setTimeout(()=>{
let h="";
data.forEach(d=>{h+=`<tr><td style="padding:9px;border-bottom:1px solid #f1f5f9;">${d.title}</td><td style="border-bottom:1px solid #f1f5f9;">${d.user}</td><td style="border-bottom:1px solid #f1f5f9;color:${d.color};font-weight:600;">${d.status}</td><td style="border-bottom:1px solid #f1f5f9;"><button style="background:#0f172a;color:white;border:none;padding:4px 9px;border-radius:6px;font-size:11px;">View</button></td></tr>`});
document.getElementById("tbody").innerHTML=h;
},900);
</script>
</body></html>
