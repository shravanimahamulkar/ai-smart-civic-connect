<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><style>body{font-family:system-ui;background:#f1f5f9;margin:0}.nav{background:#0f172a;color:#fff;padding:14px 20px;display:flex;justify-content:space-between}.btn{padding:8px 14px;background:#ef4444;color:#fff;border:0;border-radius:8px;cursor:pointer;font-weight:600}.card{background:#fff;margin:20px;padding:18px;border-radius:12px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:left;font-size:14px}th{background:#f8fafc}</style></head><body><div class="nav"><b>Admin Panel - Verified ✅</b><div><span id="aemail" style="font-size:12px;color:#94a3b8;margin-right:10px"></span><button class="btn" id="logout">Secure Logout</button></div></div><div class="card"><h3>All Complaints</h3><table><thead><tr><th>Title</th><th>User</th><th>Status</th><th>Action</th></tr></thead><tbody id="tbody"><tr><td colspan="4" style="text-align:center">Loading & Verifying...</td></tr></tbody></table></div><script type="module">import { auth, db } from "/static/js/firebase-config.js";import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";import { doc, getDoc, collection, getDocs, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";onAuthStateChanged(auth, async (u)=>{if(!u){location.href="/admin_login";return;}const s=await getDoc(doc(db,"admins",u.uid));if(!s.exists()||s.data().role!=="admin"||!s.data().isVerified){alert("Unauthorized");await signOut(auth);location.href="/admin_login";return;}document.getElementById('aemail').innerText=u.email;const q=await getDocs(collection(db,"complaints"));let h="";q.forEach(d=>{const c=d.data();h+=`<tr><td>${c.title}</td><td style="font-size:12px">${c.userEmail||''}</td><td>${c.status}</td><td><select onchange="up('${d.id}',this.value)"><option ${c.status=='Pending'?'selected':''}>Pending</option><option ${c.status=='In Progress'?'selected':''}>In Progress</option><option ${c.status=='Resolved'?'selected':''}>Resolved</option></select></td></tr>`});document.getElementById('tbody').innerHTML=h||'<tr><td colspan=4>No complaints</td></tr>';});window.up=async(id,s)=>{await updateDoc(doc(db,"complaints",id),{status:s});alert("Updated to "+s);};document.getElementById('logout').onclick=async()=>{if(confirm("Secure Logout?")){localStorage.clear();sessionStorage.clear();await signOut(auth);location.href="/admin_login";}};</script></body></html>
