<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Officer Dashboard</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#F5F7FA;font-family:Poppins}.card{border:none;border-radius:14px;box-shadow:0 4px 12px rgba(0,0,0,.05)}</style></head><body>
<nav class="navbar bg-white shadow-sm"><div class="container"><b>👮 Officer Dashboard</b><div><input id="search" class="form-control form-control-sm d-inline" style="width:160px" placeholder="Search"><select id="filter" class="form-select form-select-sm d-inline ms-2" style="width:130px"><option value="">All</option><option>Pending</option><option>In Progress</option><option>Resolved</option></select><a href="index.html" class="btn btn-sm btn-outline-danger ms-2">Logout</a></div></div></nav>
<div class="container py-4"><div id="list">Loading Firebase complaints...</div></div>
<script type="module">
import {firebaseConfig} from "./static/firebase-config.js";import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import{getFirestore,collection,getDocs,doc,updateDoc}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp(firebaseConfig);const db=getFirestore(app);let all=[];
async function load(){const s=await getDocs(collection(db,"complaints"));all=[];s.forEach(d=>all.push({id:d.id,...d.data()}));render(all);}function render(data){let h="";data.forEach(c=>{h+=`<div class='card p-3 mb-2'><div class='row'><div class='col-md-8'><b>${c.category}</b> - ${c.description}<br><small>📍 ${c.location} | UID: ${c.uid?.slice(0,6)}</small>${c.image?`<br><a href='${c.image}' target='_blank'>🖼️ View Image</a>`:''}</div><div class='col-md-4 text-end'><select onchange="upd('${c.id}',this.value)" class='form-select form-select-sm'><option ${c.status=='Pending'?'selected':''}>Pending</option><option ${c.status=='In Progress'?'selected':''}>In Progress</option><option ${c.status=='Resolved'?'selected':''}>Resolved</option></select><small class='text-success mt-1 d-block'>Firebase CRUD Live</small></div></div></div>`});list.innerHTML=h||"No data";}window.upd=async(id,st)=>{await updateDoc(doc(db,"complaints",id),{status:st});alert("Updated: "+st);};search.addEventListener('input',e=>{render(all.filter(c=>c.category.toLowerCase().includes(e.target.value.toLowerCase())||c.description.toLowerCase().includes(e.target.value.toLowerCase())));});filter.addEventListener('change',e=>{if(!e.target.value)render(all);else render(all.filter(c=>c.status==e.target.value));});load();
</script>
<footer style="background:#0f172a; color:#cbd5e1; text-align:center; padding:22px 15px; font-size:14px; line-height:1.9; margin-top:50px; border-top:3px solid #2563eb; font-family:'Poppins',sans-serif;">

  <b style="color:white;">College:</b> Arvind Gavali College of Engineering
</footer>
</body>
</html>
