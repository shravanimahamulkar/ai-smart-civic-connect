<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#eef3ff;font-family:Segoe UI}.card{border:none;border-radius:16px;box-shadow:0 8px 20px rgba(0,0,0,0.06)}.empty{padding:30px;text-align:center;background:#fff;border-radius:16px;color:#64748b}</style>
</head><body>
<nav class="navbar bg-white shadow-sm px-4"><b style="color:#2563eb">AI Smart Civic Connect</b><a href="complaint.html" class="btn btn-primary btn-sm">+ New Complaint</a></nav>
<div class="container mt-4"><h4 class="fw-bold">Citizen Dashboard (Live)</h4><p class="text-muted" style="font-size:13px">Auto-refresh dar 3 sec la</p><div id="list">Loading live complaints...</div></div>
<script>
function load(){
  let data = JSON.parse(localStorage.getItem("complaints") || "[]");
  let h="";
  if(data.length==0){
    h=`<div class="empty">No complaints yet<br><small>complaint.html वर जाऊन Water टाईप करून Submit करा</small></div>`;
  } else {
    data.slice().reverse().forEach(c=>{
      let color = c.status=='Pending' ? 'bg-warning text-dark' : 'bg-success';
      h+=`<div class="card p-3 mb-3"><b>${c.cat}</b> <span class="badge ${color} float-end">${c.status}</span><p class="mt-2 mb-1">${c.desc}</p><small>📍 ${c.loc||'No location'} | 🕒 ${c.date}</small></div>`
    });
  }
  document.getElementById('list').innerHTML=h;
}
load();
setInterval(load, 3000);
</script>
<footer style="background:#0f172a; color:#cbd5e1; text-align:center; padding:22px 15px; font-size:14px; line-height:1.9; margin-top:50px; border-top:3px solid #2563eb; font-family:'Poppins',sans-serif;">

</footer>
</body>
</html>
