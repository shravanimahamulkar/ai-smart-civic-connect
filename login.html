<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Smart Civic - Login</title>
  <style>
    *{box-sizing:border-box}
    body{font-family:'Segoe UI',Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;background:#eef2f7;margin:0}
    .box{background:white;padding:32px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,0.1);width:100%;max-width:360px}
    h2{text-align:center;margin:0 0 20px 0;color:#1e293b}
    input{width:100%;padding:12px;margin:8px 0;border:1px solid #cbd5e1;border-radius:10px;font-size:14px;outline:none}
    input:focus{border-color:#2563eb;box-shadow:0 0 0 2px #dbeafe}
    button{width:100%;padding:12px;background:#2563eb;color:white;border:none;border-radius:10px;cursor:pointer;margin-top:14px;font-weight:600;font-size:15px}
    button:hover{background:#1d4ed8}
    .info{font-size:13px;color:#64748b;text-align:center;margin-top:12px;background:#f8fafc;padding:8px;border-radius:8px}
  </style>
</head>
<body>

<div class="box">
  <h2>AI Civic Login</h2>
  <form id="loginForm">
    <input type="email" id="email" placeholder="Enter your Email" required />
    <input type="password" id="password" placeholder="Enter Password (min 4)" required />
    <button type="submit">Login</button>
  </form>
  <div class="info">Any Email / Password will work<br>Ex: shravani@gmail.com / 1234</div>
</div>

<script>
  document.getElementById("loginForm").addEventListener("submit", function(e){
    e.preventDefault();
    
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!email.includes("@")) {
      alert("Please enter a valid Email!");
      return;
    }
    if (password.length < 4) {
      alert("Password must be at least 4 characters!");
      return;
    }

    // Save Login Session
    localStorage.setItem("isLoggedIn", "true");
    localStorage.setItem("userEmail", email);
    
    alert("Login Successful! Welcome " + email);
    window.location.href = "dashboard.html"; 
  });
</script>

<footer style="background:#0f172a; color:#cbd5e1; text-align:center; padding:20px; font-size:14px; line-height:1.8; margin-top:50px; border-top:3px solid #2563eb;">
  <b style="color:white;">Developed by:</b> Shravani Mahamulkar <br>
  <b style="color:white;">Program:</b> Inplant Training 2026 <br>
  <b style="color:white;">College:</b> Arvind Gavali College of Engineering
</footer>
</body>
</html>
