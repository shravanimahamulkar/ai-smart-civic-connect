<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - AI Smart Civic</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#eef2ff;font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:15px}
.card{width:100%;max-width:420px;border-radius:18px;border:none;box-shadow:0 8px 25px rgba(0,0,0,.12);padding:28px;background:white}
</style>
</head>
<body>

<div class="card">
<h4 class="fw-bold text-center">Login</h4>
<p class="text-center text-muted small mb-4">AI Smart Civic Connect</p>

<input id="email" type="email" class="form-control mb-3" placeholder="Email" value="shravanimahamulkar06@gmail.com">
<input id="password" type="password" class="form-control mb-3" placeholder="Password">
<button id="loginBtn" class="btn btn-primary w-100 py-2 fw-bold">Login</button>
<p class="text-center small mt-3"><a href="signup.html">Create new account</a></p>
<div id="msg" class="small text-center mt-2 text-danger"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBb6Sx102Ak4XBwcAgEp__sGwqYtDaB7oY",
  authDomain: "ai-smart-civic-connect.firebaseapp.com",
  databaseURL: "https://ai-smart-civic-connect-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ai-smart-civic-connect",
  storageBucket: "ai-smart-civic-connect.firebasestorage.app",
  messagingSenderId: "763742973098",
  appId: "1:763742973098:web:b067eda8818aea0e9734d3",
  measurementId: "G-TP3PWBDDN4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

document.getElementById("loginBtn").addEventListener("click", async ()=>{
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const msg = document.getElementById("msg");
  const btn = document.getElementById("loginBtn");
  
  if(!email || !password){ msg.innerText="Email and Password taka"; return; }
  
  btn.innerText="Logging in..."; btn.disabled=true;
  msg.innerText="";
  try{
    await signInWithEmailAndPassword(auth, email, password);
    btn.innerText="Success ✅";
    btn.style.background="#198754";
    window.location.href="dashboard.html";
  }catch(err){
    msg.innerText=err.message;
    btn.innerText="Login"; btn.disabled=false;
  }
});
</script>
</body>
</html>
