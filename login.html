<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Smart Civic - Login</title>
  <style>
    body{font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh;background:#f0f4f8}
    .box{background:white;padding:30px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,0.1);width:300px}
    h2{text-align:center;margin-bottom:20px}
    input{width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:8px}
    button{width:100%;padding:11px;background:#2563eb;color:white;border:none;border-radius:8px;cursor:pointer;margin-top:10px;font-weight:bold}
    button:hover{background:#1d4ed8}
    .note{font-size:12px;color:#666;text-align:center;margin-top:10px}
  </style>
</head>
<body>

<div class="box">
  <h2>Login</h2>
  <form id="loginForm">
    <input type="email" id="email" placeholder="Email - admin@civic.com" required />
    <input type="password" id="password" placeholder="Password - admin123" required />
    <button type="submit">Login</button>
  </form>
  <p class="note">Demo: admin@civic.com / admin123</p>
</div>

<script>
  // Firebase shivay Login Logic
  const validUsers = [
    { email: "admin@civic.com", password: "admin123", role: "admin" },
    { email: "user@gmail.com", password: "1234", role: "user" }
  ];

  document.getElementById("loginForm").addEventListener("submit", function(e){
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    const found = validUsers.find(u => u.email === email && u.password === password);

    if(found){
      localStorage.setItem("isLoggedIn", "true");
      localStorage.setItem("userEmail", found.email);
      localStorage.setItem("userRole", found.role);
      
      alert("Login Successful! Welcome " + found.email);
      window.location.href = "dashboard.html"; // Sir na dakhavaycha pudhcha page
    } else {
      alert("Invalid Email or Password!\nUse: admin@civic.com / admin123");
    }
  });
</script>

</body>
</html>
