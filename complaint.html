<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Civic Connect</title>
<style>body{margin:0;font-family:system-ui;background:#eef2ff}.top{background:#fff;padding:12px 20px;font-weight:700;color:#2563eb}.wrap{max-width:1100px;margin:auto;display:flex;gap:20px;padding:15px;flex-wrap:wrap}.box{background:#fff;border-radius:14px;padding:16px;box-shadow:0 4px 12px rgba(0,0,0,.08)}.chat{flex:1;min-width:320px;max-width:380px;display:flex;flex-direction:column;height:500px}.form{flex:1.2;min-width:340px}#msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;background:#f8fafc;padding:10px;border-radius:10px}.msg{padding:10px 12px;border-radius:12px;font-size:13.5px;max-width:85%}.user{align-self:flex-end;background:#2563eb;color:#fff}.ai{align-self:flex-start;background:#e0e7ff}.row{display:flex;gap:8px;margin-top:10px}.row input{flex:1;padding:10px;border:1px solid #cbd5e1;border-radius:8px}.row button{background:#2563eb;color:#fff;border:none;padding:0 16px;border-radius:8px}select,textarea,input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:8px;margin-bottom:12px;box-sizing:border-box}textarea{height:90px}.btn{width:100%;background:#2563eb;color:#fff;border:none;padding:13px;border-radius:10px;font-weight:700;cursor:pointer}</style></head><body>
<div class="top">AI Smart Civic Connect</div>
<div class="wrap">
<div class="box chat"><b>🤖 AI Assistant</b><div id="msgs"><div class="msg ai">Hello! Type Water, Road, Light etc.</div></div><div class="row"><input id="chatInput" placeholder="Type here..."><button id="sendBtn">Send</button></div></div>
<div class="box form" id="complaintView"><h3>File Complaint</h3><select id="category"><option>Garbage</option><option>Pothole</option><option>Street Light</option><option selected>Water Supply</option><option>Drainage</option></select><textarea id="description"></textarea><div style="display:flex;gap:8px"><input id="loc" value="18.6857,73.8346"><button onclick="navigator.geolocation.getCurrentPosition(p=>loc.value=p.coords.latitude.toFixed(4)+','+p.coords.longitude.toFixed(4))">📍GPS</button></div><button class="btn" onclick="submitComplaint()">Submit Complaint</button></div>
<div class="box form" id="dashboardView" style="display:none"><h3>Dashboard</h3><div id="list"></div><button class="btn" style="background:#64748b" onclick="location.reload()">+ New</button></div>
</div>
<script>
function addMsg(t,w){let d=document.createElement('div');d.className='msg '+w;d.innerText=t;msgs.appendChild(d);msgs.scrollTop=9999}
sendBtn.onclick=()=>{let t=chatInput.value.trim();if(!t)return;let v=t.toLowerCase();addMsg(t,'user');chatInput.value='';setTimeout(()=>{let c='Water Supply';if(v.includes('road')||v.includes('pothole'))c='Pothole';else if(v.includes('light'))c='Street Light';else if(v.includes('water')||v.includes('pani'))c='Water Supply';else if(v.includes('drain'))c='Drainage';else c='Garbage';category.value=c;description.value=t;addMsg('Your '+c+' complaint is ready. Click Submit.','ai')},300)}
function submitComplaint(){let d=description.value;if(!d){alert('आधी Water टाईप करा');return}let a=JSON.parse(localStorage.getItem('complaints')||'[]');a.push({cat:category.value,desc:d,loc:loc.value,status:'Pending',date:new Date().toLocaleString()});localStorage.setItem('complaints',JSON.stringify(a));complaintView.style.display='none';dashboardView.style.display='block';let h='';a.slice().reverse().forEach(x=>{h+=`<div style="border:1px solid #e2e8f0;padding:12px;border-radius:10px;margin-bottom:10px"><b>${x.cat}</b> <span style="float:right;background:#fef08a;padding:2px 6px;border-radius:6px;font-size:12px">${x.status}</span><p>${x.desc}</p><small>📍 ${x.loc} | ${x.date}</small></div>`});list.innerHTML=h}
</script>
<footer style="background:#0f172a;color:#cbd5e1;text-align:center;padding:22px 15px;font-size:14px;line-height:1.9;margin-top:50px;border-top:3px solid #2563eb;"><b style="color:white;">Developed by:</b> Shravani Mahamulkar<br><b style="color:white;">Program:</b> Inplant Training 2026<br><span style="color:#fbbf24;font-weight:600;">Indradeep Information Technology Pvt Ltd</span><br><b style="color:white;">College:</b> Arvind Gavali College of Engineering</footer>
</body></html>
