<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - AI Smart Civic</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#eef2ff;font-family:sans-serif;padding:15px}
.card{max-width:500px;margin:20px auto;border-radius:18px;border:none;box-shadow:0 8px 25px rgba(0,0,0,.1);padding:22px}
</style>
</head>
<body>

<div class="card">
<h4 class="fw-bold">Send a Message</h4>
<form id="contactForm" class="mt-3">
<input id="name" class="form-control mb-3" value="Shravani Mahamulkar" required>
<input id="email" type="email" class="form-control mb-3" value="shravanimahamulkar06@gmail.com" required>
<textarea id="message" class="form-control mb-3" rows="4" placeholder="Write your message..." required></textarea>
<button id="btn" type="submit" class="btn btn-primary w-100 py-2 fw-bold">Send to Firebase</button>
<p class="text-center small text-muted mt-2">Data will save in Firebase -> Data tab</p>
</form>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBb6Sx102Ak4XBwcAgEp__sGwqYtDaB7oY",
  authDomain: "ai-smart-civic-connect.firebaseapp.com",
  databaseURL: "https://ai-smart-civic-connect-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ai-smart-civic-connect",
  storageBucket: "ai-smart-civic-connect.firebasestorage.app",
  messagingSenderId: "763742973098",
  appId: "1:763742973098:web:b067eda8818aea0e9734d3",
  measurementId: "G-TP3PWBDDN4"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

document.getElementById("contactForm").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const btn = document.getElementById("btn");
  btn.innerText = "Sending..."; btn.disabled = true;
  try{
    await push(ref(db, "contacts"), {
      name: document.getElementById("name").value,
      email: document.getElementById("email").value,
      message: document.getElementById("message").value,
      timestamp: new Date().toLocaleString()
    });
    btn.innerText = "Sent ✅ Done!"; btn.style.background = "#198754";
    alert("Success! Aata Firebase -> Realtime Database -> Data tab -> Refresh kar");
    e.target.reset();
    setTimeout(()=>{btn.innerText="Send to Firebase"; btn.disabled=false; btn.style.background="";},2000);
  }catch(err){
    alert("Error: "+err.message); btn.innerText="Send to Firebase"; btn.disabled=false;
  }
});
</script>
  <footer style="background:#0f172a; color:#cbd5e1; text-align:center; padding:20px; font-size:14px; line-height:1.8; margin-top:50px; border-top:3px solid #2563eb;">
  <b style="color:white;">Developed by:</b> Shravani Mahamulkar <br>
  <b style="color:white;">Program:</b> Inplant Training 2026 <br>
  <b style="color:white;">College:</b> Arvind Gavali College of Engineering
</footer>
</body>
</html>
