<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Status Tracking</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#F5F7FA;font-family:Poppins}.card{border:none;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.05)}</style></head><body>
<nav class="navbar bg-white shadow-sm"><div class="container"><a class="navbar-brand fw-bold" href="index.html">📦 Status Tracking</a><a href="dashboard.html" class="btn btn-sm btn-primary rounded-pill">Dashboard</a></div></nav>
<div class="container py-4"><div class="card p-4"><h5>Live Status - Firebase Realtime</h5><p class="text-muted small">Pending → In Progress → Resolved</p><div id="list">Loading...</div></div></div>
<script type="module">
import {firebaseConfig} from "./static/firebase-config.js";import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";import{getFirestore,collection,query,where,getDocs}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getFirestore(app);
onAuthStateChanged(auth,async(u)=>{if(!u){location.href="login.html";return;}const q=query(collection(db,"complaints"),where("uid","==",u.uid));const s=await getDocs(q);let h="";s.forEach(d=>{let c=d.data();let col=c.status=="Pending"?"warning":c.status=="In Progress"?"primary":"success";let pct=c.status=="Pending"?30:c.status=="In Progress"?70:100;h+=`<div class='card p-3 mb-2 bg-light'><div class='d-flex justify-content-between'><b>${c.category}</b><span class='badge bg-${col}'>${c.status}</span></div><small>${c.description}</small><br><small>📍 ${c.location||''}</small><div class='progress mt-2' style='height:7px'><div class='progress-bar bg-${col}' style='width:${pct}%'></div></div></div>`});document.getElementById('list').innerHTML=h||"No complaints found";});
</script>
</body></html>
