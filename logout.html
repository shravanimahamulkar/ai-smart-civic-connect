<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logout</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body style="background:#f5f7fa;display:flex;align-items:center;justify-content:center;height:100vh">
<div class="card p-4 text-center shadow border-0 rounded-4" style="max-width:380px;width:90%">
<div style="font-size:50px">👋</div><h4 class="fw-bold mt-2">Logging out...</h4><p class="text-muted small">Tumhala baher kadhat aahot</p>
<div class="spinner-border text-primary mt-2" role="status"></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
const firebaseConfig = {
  apiKey: "AIzaSyBb6Sx102Ak4XBwcAgEp__sGwqYtDaB7oY",
  authDomain: "ai-smart-civic-connect.firebaseapp.com",
  databaseURL: "https://ai-smart-civic-connect-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ai-smart-civic-connect",
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
try{
  await signOut(auth);
  localStorage.clear(); sessionStorage.clear();
  setTimeout(()=>{ alert("Logout Success!"); location.href="login.html"; },1200);
}catch(e){ alert(e.message); location.href="index.html"; }
</script></body></html>
