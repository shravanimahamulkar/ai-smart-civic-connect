<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body style="background:#eef2ff;padding:20px">
<div style="max-width:400px;margin:50px auto;background:white;padding:25px;border-radius:15px">
<h4 class="fw-bold">User Register</h4>
<form id="regForm" class="mt-3">
<input id="name" class="form-control mb-2" placeholder="Full Name" required>
<input id="email" type="email" class="form-control mb-2" placeholder="Email" required>
<input id="pass" type="password" class="form-control mb-3" placeholder="Password (6+ chars)" required>
<button class="btn btn-success w-100">Create Account</button>
</form></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyBb6Sx102Ak4XBwcAgEp__sGwqYtDaB7oY",
  authDomain: "ai-smart-civic-connect.firebaseapp.com",
  databaseURL: "https://ai-smart-civic-connect-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ai-smart-civic-connect",
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app); const db = getDatabase(app);
document.getElementById("regForm").addEventListener("submit", async(e)=>{
 e.preventDefault();
 try{
  const cred = await createUserWithEmailAndPassword(auth, email.value, pass.value);
  await set(ref(db, "users/"+cred.user.uid), {name: name.value, email: email.value});
  alert("Account Created!"); location.href="login.html";
 }catch(err){ alert(err.message); }
});
</script>
<footer style="background:#0f172a; color:#cbd5e1; text-align:center; padding:20px; font-size:14px; line-height:1.8; margin-top:50px; border-top:3px solid #2563eb;">

  <b style="color:white;">Program:</b> Inplant Training 2026 <br>
  <b style="color:white;">College:</b> Arvind Gavali College of Engineering
</footer>
</body>
</html>
